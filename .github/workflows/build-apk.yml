name: Build Quran Baanto APK (Debug & Test)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Set up Environment Variables (.env)
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          ADMOB_APP: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            echo "$ENV_CONTENT" > .env
          fi

          if [ -n "$FB_PROJECT_ID" ]; then
            sed -i '/FIREBASE_PROJECT_ID=/d' .env
            echo "FIREBASE_PROJECT_ID=$FB_PROJECT_ID" >> .env
          fi
          if [ -n "$FB_API_KEY" ]; then
            sed -i '/FIREBASE_API_KEY=/d' .env
            echo "FIREBASE_API_KEY=$FB_API_KEY" >> .env
          fi
          if [ -n "$ADMOB_APP" ]; then
            sed -i '/ADMOB_APP_ID=/d' .env
            echo "ADMOB_APP_ID=$ADMOB_APP" >> .env
          fi
          if [ -n "$ADMOB_REWARDED" ]; then
            sed -i '/ADMOB_REWARDED_AD_UNIT_ID=/d' .env
            echo "ADMOB_REWARDED_AD_UNIT_ID=$ADMOB_REWARDED" >> .env
          fi

      - name: Set up Google Services JSON for Firebase
        env:
          GS_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_BASE64" ]; then
            echo "$GS_BASE64" | base64 --decode > app/google-services.json
            echo "Successfully updated google-services.json from GitHub Secrets"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-baanto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
