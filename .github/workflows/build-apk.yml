name: Build Quran Baanto APK (Debug & Test)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept Android SDK Licenses and Install SDK Packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Environment Variables (.env)
        run: |
          if [ -n "${{ secrets.ENV_FILE_CONTENT }}" ]; then
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
          elif [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

          # Inject individual secrets if set in GitHub Secrets
          if [ -n "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            sed -i '/FIREBASE_PROJECT_ID=/d' .env
            echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          fi
          if [ -n "${{ secrets.FIREBASE_API_KEY }}" ]; then
            sed -i '/FIREBASE_API_KEY=/d' .env
            echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          fi
          if [ -n "${{ secrets.ADMOB_APP_ID }}" ]; then
            sed -i '/ADMOB_APP_ID=/d' .env
            echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> .env
          fi
          if [ -n "${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}" ]; then
            sed -i '/ADMOB_REWARDED_AD_UNIT_ID=/d' .env
            echo "ADMOB_REWARDED_AD_UNIT_ID=${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}" >> .env
          fi

      - name: Set up Google Services JSON for Firebase
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json
            echo "Successfully decoded google-services.json from GitHub Secrets"
          elif [ -f app/google-services.json.example ]; then
            cp app/google-services.json.example app/google-services.json
            echo "Using placeholder app/google-services.json.example for build"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-baanto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
