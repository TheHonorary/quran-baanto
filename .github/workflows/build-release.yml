name: Build Production Release (Play Store AAB & Release APK)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes / Description'
        required: false
        default: 'Production release for Google Play Store'
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Signed Release AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept Android SDK Licenses and Install SDK Packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Environment Variables (.env)
        run: |
          if [ -n "${{ secrets.ENV_FILE_CONTENT }}" ]; then
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
          fi

          # Override individual secrets from GitHub Secrets if defined
          if [ -n "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            sed -i '/FIREBASE_PROJECT_ID=/d' .env
            echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          fi
          if [ -n "${{ secrets.FIREBASE_PROJECT_NUMBER }}" ]; then
            sed -i '/FIREBASE_PROJECT_NUMBER=/d' .env
            echo "FIREBASE_PROJECT_NUMBER=${{ secrets.FIREBASE_PROJECT_NUMBER }}" >> .env
          fi
          if [ -n "${{ secrets.FIREBASE_APP_ID }}" ]; then
            sed -i '/FIREBASE_APP_ID=/d' .env
            echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env
          fi
          if [ -n "${{ secrets.FIREBASE_STORAGE_BUCKET }}" ]; then
            sed -i '/FIREBASE_STORAGE_BUCKET=/d' .env
            echo "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> .env
          fi
          if [ -n "${{ secrets.FIREBASE_API_KEY }}" ]; then
            sed -i '/FIREBASE_API_KEY=/d' .env
            echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          fi
          if [ -n "${{ secrets.ADMOB_APP_ID }}" ]; then
            sed -i '/ADMOB_APP_ID=/d' .env
            echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> .env
          fi
          if [ -n "${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}" ]; then
            sed -i '/ADMOB_REWARDED_AD_UNIT_ID=/d' .env
            echo "ADMOB_REWARDED_AD_UNIT_ID=${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}" >> .env
          fi

      - name: Set up Google Services JSON for Firebase
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json
            echo "Successfully updated google-services.json from GitHub Secrets"
          fi

      - name: Set up Release Signing Key
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=my-upload-key.jks" >> $GITHUB_ENV
            echo "Using custom release keystore from GitHub Secrets"
          else
            echo "Generating self-signed upload keystore for CI build verification..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Quran Baanto, OU=Mobile, O=Quran Baanto, L=Global, ST=Online, C=US"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=my-upload-key.jks" >> $GITHUB_ENV
            echo "Self-signed CI keystore generated successfully"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Release Bundle (AAB for Google Play Store)
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build Release APK (Sideload / Direct Testing)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: quran-baanto-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-baanto-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
